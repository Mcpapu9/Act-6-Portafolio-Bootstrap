<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="keywords" content="Contacto Luis, Enviar mensaje, Formulario de contacto, UTL estudiante">
  <meta name="description" content="Formulario de contacto para comunicarse con Luis sobre proyectos o colaboraciones.">
  <link rel="icon" type="image/x-icon" href="Favicon/favicon.ico">
  <title>Portafolio Personal | Contacto</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary" href="index.html">
        <i class="fa-solid fa-terminal me-2"></i>Portafolio
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html"><i class="fa-solid fa-house me-1"></i> Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="academico.html"><i class="fa-solid fa-graduation-cap me-1"></i> Formación y Proyectos</a></li>
          <li class="nav-item"><a class="nav-link active" href="contacto.html"><i class="fa-solid fa-envelope me-1"></i> Contacto</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">
        <div class="card border-0 shadow-sm p-4">
          <h1 class="h3 fw-bold text-center mb-4"><i class="fa-solid fa-envelope me-2 text-primary"></i>Formulario de Contacto</h1>
          <form action="#" method="POST" onsubmit="event.preventDefault(); alert('Mensaje enviado exitosamente.');">
            <div class="mb-3">
              <label for="nombre" class="form-label fw-semibold">Nombre Completo:</label>
              <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Tu nombre" required>
            </div>

            <div class="mb-3">
              <label for="email" class="form-label fw-semibold">Correo Electrónico:</label>
              <input type="email" class="form-control" id="email" name="email" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="mb-3">
              <label for="asunto" class="form-label fw-semibold">Asunto:</label>
              <input type="text" class="form-control" id="asunto" name="asunto" placeholder="Motivo del mensaje" required>
            </div>

            <div class="mb-3">
              <label for="mensaje" class="form-label fw-semibold">Mensaje:</label>
              <textarea class="form-control" id="mensaje" name="mensaje" rows="4" placeholder="Escribe tu mensaje aquí..." required></textarea>
            </div>

            <button type="submit" class="btn btn-primary w-100 fw-bold">
              <i class="fa-solid fa-paper-plane me-1"></i> Enviar Mensaje
            </button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <footer class="bg-dark text-white text-center py-4 mt-5">
    <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center">
      <p class="mb-2 mb-md-0">&copy; 2026 Portafolio Web Personal | Luis - Desarrollo de Software</p>
      <a href="https://github.com/Mcpapu9/" target="_blank" class="btn btn-outline-light btn-sm">
        <i class="fa-brands fa-github me-1"></i> GitHub
      </a>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
